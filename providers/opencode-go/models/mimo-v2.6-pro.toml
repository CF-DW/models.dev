# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/xiaomi/models/mimo-v2.6-pro.toml (Go passes requests through).
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[capabilities]
reasoning = { supported = true }
system_updates = true
effort_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.435
cache = { read = 0.003625 }

[cost.text.output]
price = 0.87
