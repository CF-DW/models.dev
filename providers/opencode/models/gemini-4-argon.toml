# Pricing and endpoint (Gemini generateContent): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# The docs list Gemini 4 Argon at 50% off ($2/$10/$0.10, struck-through $4/$20/$0.20) through November 30, 2026; the multiplier restores list prices from 2026-12-01.
# Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high
# Mid-conversation (live on Zen 2026-10-21; warm prefix, then the change before the next turn vs an unchanged control; cached prompt tokens control -> changed):
#   system_updates left out (false): Gemini contents only take user and model roles (https://ai.google.dev/api/caching#Content) and Google's own
#     entries don't claim it, so the host value follows the lab. Zen accepted a role system entry in a 2026-10-23 spot check, but that isn't relied on.
#   effort_updates left out (false): re-tested 2026-10-23, changing thinkingConfig.thinkingLevel for one turn dropped the cache every time
#     (low -> high 0/0, high -> low 0/0) while the unchanged control kept it (6987, 6383, 7291). The 2026-10-21 "kept" was a fluke.
#   tools.updates left out (false): re-tested 2026-10-23 with the bulk in the first user message, adding or removing a function declaration
#     dropped the cache every time (add 0/0/0/0, remove 0/0) while the unchanged control kept it (7688, 7086, 6482; one miss). The 2026-10-21 "kept" was a fluke.
# Cache (live): implicit (cached tokens reported without cache markers).
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[api.generate-content]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10

[cost.audio.input]
price = 2

[[cost.multipliers]]
when = { date = { gte = "2026-12-01" } }
factor = 2
