# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = low|medium|high|xhigh (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation (2026-10-23): system_updates = true, derived from the lab (providers/xai/models/grok-4.6.toml) and the Grok on Zen Responses spot check,
#   since this model returns 403 to the probe key. Live on Zen 2026-10-23: grok-4.7: a developer message before the next user turn kept the cache.
schema = 2
base_model = "xai/grok-4.6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
