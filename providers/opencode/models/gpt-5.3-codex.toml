# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = none|low|medium|high|xhigh (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation (2026-10-23): system_updates = true, derived from the lab (providers/openai/models/gpt-5.3-codex.toml) and the GPT on Zen Responses spot check,
#   since this model returns 403 to the probe key. Live on Zen 2026-10-23: gpt-5-nano and the GPT-5.6/6.x models: a developer message before the next user turn kept the cache and was followed.
schema = 2
base_model = "openai/gpt-5.3-codex"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
