# Pricing and endpoint (Gemini generateContent): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high (not re-verified on Zen: not probed)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/google/models/gemini-3.1-pro-preview.toml (Zen passes requests through).
#   system_updates true although the lab doesn't claim it: a contents entry with role system before the next user turn kept the cache and was followed on Zen (live 2026-10-23: cached 4061-6095 in 4 of 4 trials where the warm-up cached, control 4072-8693, French 5/5; Zen leaves it out of promptTokenCount, but a same-seed check shows the model reads it).
schema = 2
base_model = "google/gemini-3.1-pro-preview"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = true

[api.generate-content]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
