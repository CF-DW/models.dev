# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Modalities: PDF input via input_file (https://developers.openai.com/api/docs/guides/pdf-files); Zen forwards Responses requests to OpenAI.
# Effort: reasoning.effort = none|low|medium|high|xhigh (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation (2026-10-23): system_updates = true, derived from the lab (providers/openai/models/gpt-5.4-nano.toml) and the GPT on Zen Responses spot check,
#   since this model returns 403 to the probe key. Live on Zen 2026-10-23: gpt-5-nano and the GPT-5.6/6.x models: a developer message before the next user turn kept the cache and was followed.
schema = 2
base_model = "openai/gpt-5.4-nano"
name = "GPT-5.4 Nano"
description = "Compact GPT model for low-latency assistance and high-volume workloads"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
