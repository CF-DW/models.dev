# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Mid-conversation (2026-10-23): system_updates = true, derived from the lab (providers/moonshotai/models/kimi-k2.7-code.toml) and the Kimi on Zen Chat Completions spot check,
#   since this model returns 403 to the probe key. Live on Zen 2026-10-23: kimi-k3: a system message before the next user turn kept the cache and was followed.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true }
structured_output = true
system_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
