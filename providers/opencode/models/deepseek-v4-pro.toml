# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = high|max
# Mid-conversation (live on Zen 2026-10-21; warm prefix, then the change before the next turn vs an unchanged control; cached prompt tokens control -> changed):
#   system_updates left out (false): DeepSeek's own API moves a late system message to the leading prompt and drops the cache (providers/deepseek/models/deepseek-v4-pro.toml),
#     so the host value follows the lab. Zen's route kept the cache in a 2026-10-23 spot check, but that isn't relied on.
#   effort_updates = false: reasoning_effort high -> max dropped the cache (cached 8448 -> 0)
#   tools.updates = false: adding a tool dropped the cache (cached 9001 -> 0)
# Cache (live): implicit (cached tokens reported without cache markers).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
cache = { implicit = true }
effort_updates = false

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.74
cache = { read = 0.145 }

[cost.text.output]
price = 3.48
