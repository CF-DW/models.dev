# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = high|max
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/deepseek/models/deepseek-v4-pro.toml (Zen passes requests through).
#   system_updates true although the lab doesn't claim it: a system message before the next user turn kept the cache and was followed on Zen (live 2026-10-23: cached 6933-7839 vs control 6932-7536, French 5/5), so Zen's route doesn't hoist it like DeepSeek's own API.
#   effort_updates true although the lab doesn't claim it: turning thinking on or off for one turn with thinking.type kept the cache on Zen (live 2026-10-23: disabled -> enabled 6933-7537 in 5/5, enabled -> disabled 7234-7536 in 5/5, controls 6932-7539, 0 reasoning tokens after disabling); changing reasoning_effort between high and max still drops it (0 in 4/4).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
cache = { implicit = true }
system_updates = true
effort_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.74
cache = { read = 0.145 }

[cost.text.output]
price = 3.48
