# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning_effort = high|max (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation (2026-10-23): system_updates = true, derived from the lab (providers/zhipuai/models/glm-5.2.toml) and the GLM on Zen Chat Completions spot check,
#   since this model returns 403 to the probe key. Live on Zen 2026-10-23: glm-5.3 and glm-5.3-flash: a system message before the next user turn kept the cache and was followed.
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true
system_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
