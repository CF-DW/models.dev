# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# The docs list the cached-read price equal to the input price ($30).
# Modalities: PDF input via input_file (https://developers.openai.com/api/docs/guides/pdf-files); Zen forwards Responses requests to OpenAI.
# Effort: reasoning.effort = medium|high|xhigh (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation (2026-10-23): system_updates = true, derived from the lab (providers/openai/models/gpt-5.4-pro.toml) and the GPT on Zen Responses spot check,
#   since this model returns 403 to the probe key. Live on Zen 2026-10-23: gpt-5-nano and the GPT-5.6/6.x models: a developer message before the next user turn kept the cache and was followed.
schema = 2
base_model = "openai/gpt-5.4-pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = false
system_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 30
cache = { read = 30 }

[cost.text.output]
price = 180
