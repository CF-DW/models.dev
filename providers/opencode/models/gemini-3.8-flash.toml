# Pricing and endpoint (Gemini generateContent): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/google/models/gemini-3.8-flash.toml (Zen passes requests through).
#   system_updates true although the lab doesn't claim it: a contents entry with role system before the next user turn kept the cache and was followed on Zen (live 2026-10-23: cached 4060-4063 in 7 of 9, control 4073-6110 in 11/11, French 9/9; Zen leaves it out of promptTokenCount, but a same-seed check shows the model reads it).
schema = 2
base_model = "google/gemini-3.8-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }
system_updates = true

[api.generate-content]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5

[cost.audio.input]
price = 1.5
