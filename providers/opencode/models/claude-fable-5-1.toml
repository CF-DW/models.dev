# Pricing and endpoint (Anthropic Messages): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: output_config.effort = low|medium|high|xhigh|max
# Mid-conversation (live on Zen 2026-10-23; ~7.5k-token first user message, warm twice, then the change on the next turn vs an unchanged control; cached prompt tokens):
#   system_updates = true: a role:system message after the last user turn kept the cache and was followed (control 10923-11829, system 11527/11527, French 2/2)
#   effort_updates = true: per-message output_config.effort (beta mid-conversation-output-config-2026-07-01) kept the cache both ways (low->high 11227/11225, high->low 11527/11527),
#     and so did changing the top-level output_config.effort for one turn (up 11527/11227, down 11527/11527)
# tools.updates = true: tool_addition / tool_removal with beta inline-tools-2026-09-15, as on Anthropic (providers/anthropic/models/claude-fable-5-1.toml).
#   Live on Zen 2026-10-23, cached tokens on the next turn: control 11954/11956, add 11350/12256, remove 12256/12256 (full prefix every time).
# Cache: explicit cache_control only, as on Anthropic (https://platform.claude.com/docs/en/build-with-claude/prompt-caching). Zen forwards it: block and top-level cache_control and ttl 1h were honored, and no read happened without it (live on claude-haiku-5-5, claude-opus-5-5, claude-sonnet-5 and claude-sonnet-5-5). Zen lists only the 5m write price.
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }
system_updates = true
effort_updates = true

[api.messages]
base_url = "https://opencode.ai/inference/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 10
cache = { read = 0.25, write = 12.5 }

[cost.text.output]
price = 50
