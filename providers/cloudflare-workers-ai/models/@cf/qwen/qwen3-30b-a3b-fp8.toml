# Native `/ai/run` schema does not document a selectable reasoning control.
# No model-specific OpenAI-compatible reasoning field or token budget was verified.
# https://developers.cloudflare.com/workers-ai/models/qwen3-30b-a3b-fp8/sync-input.json (accessed 2026-06-25)
# Cache: none. The model page lists no cached-input price (prefix caching is enabled per model:
# https://developers.cloudflare.com/workers-ai/features/prompt-caching/), and live repeats read 0 cached tokens.
# Mid-conversation: system_updates left out because this model has no prefix cache, so there is no cached prefix to keep (a late system message is accepted and followed, live 2026-10-19).
# No prefix cache on this model, so effort and tool changes keep nothing.
schema = 2
base_model = "alibaba/qwen3-30b-a3b"
name = "Qwen3 30B A3b fp8"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
cache = false
structured_output = false
effort_updates = false

[limit]
context = 32_768
output = 32_768

[cost.text.input]
price = 0.0509

[cost.text.output]
price = 0.335
