# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): On the novita route a mid-conversation system message stays in place and is followed (9021/9266 cached, French 2 of 2). This host lists no cached-input price, so there is no cache to lose and system_updates stays true; effort_updates and tools.updates need a cache and stay off.
schema = 2
base_model = "moonshotai/kimi-k2"
name = "Kimi K2 Instruct"
description = "Kimi model for long-context chat, coding, and agentic reasoning"

[capabilities]
tools = { supported = true, updates = false }
structured_output = false
system_updates = true
effort_updates = false

[limit]
output = 131_072

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.57

[cost.text.output]
price = 2.3
