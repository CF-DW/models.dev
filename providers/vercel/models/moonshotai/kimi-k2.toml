# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): this host lists no cached-input price for the model, so there is no cache for a mid-conversation change to keep; system_updates left out.
schema = 2
base_model = "moonshotai/kimi-k2"
name = "Kimi K2 Instruct"
description = "Kimi model for long-context chat, coding, and agentic reasoning"

[capabilities]
tools = { supported = true, updates = false }
structured_output = false
effort_updates = false

[limit]
output = 131_072

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.57

[cost.text.output]
price = 2.3
