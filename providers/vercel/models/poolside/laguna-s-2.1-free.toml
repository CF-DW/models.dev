# Sources (accessed 2026-07-22):
# - https://ai-gateway.vercel.sh/v1/models (poolside/laguna-s-2.1-free) — tags reasoning; supported_parameters include reasoning
# - https://huggingface.co/poolside/Laguna-S-2.1 — per-request thinking via enable_thinking
# - https://docs.poolside.ai/get-started/supported-models — thinking on or off per request
# API: {"chat_template_kwargs": {"enable_thinking": false}}
# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): this host lists no cached-input price for the model, so there is no cache for a mid-conversation change to keep; system_updates left out.
schema = 2
base_model = "poolside/laguna-s-2.1"
name = "Laguna S 2.1 Free"
description = "Free provider route for experiments, demos, and cost-sensitive chat workloads"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = false
effort_updates = false

[limit]
context = 256_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
