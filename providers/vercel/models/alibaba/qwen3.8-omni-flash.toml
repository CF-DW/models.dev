# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max
# Alibaba maps minimal to low and high|max to xhigh; none disables thinking.
# https://www.alibabacloud.com/help/en/model-studio/qwen-omni
# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): system_updates follows Alibaba's API (the gateway keeps system messages in place on the alibaba route: qwen3.8-flash 12168/12168, qwen3.8-27b 12168/12166). No per-turn effort or tool-change mechanism keeps the cache for this model.
schema = 2
base_model = "alibaba/qwen3.8-omni-flash"
name = "Qwen 3.8 Omni Flash"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true
effort_updates = false
system_updates = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.15
cache = { read = 0.016 }

[cost.text.output]
price = 0.47
