# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): this host lists no cached-input price for the model, so there is no cache for a mid-conversation change to keep; system_updates left out.
# tools.updates: left out. This model has no prompt caching (no cached-input price), so there is no cache for a tool change to keep.
schema = 2
base_model = "openai/gpt-5.5-pro"
name = "GPT 5.5 Pro"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 1_000_000
input = 872_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270
