# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): this host lists no cached-input price for the model, so there is no cache for a mid-conversation change to keep; system_updates left out.
# tools.updates: left out. This model has no prompt caching (no cached-input price), so there is no cache for a tool change to keep.
schema = 2
base_model = "openai/o3-pro"
name = "o3 Pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true
effort_updates = false

[limit]
input = 100_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 20

[cost.text.output]
price = 80
