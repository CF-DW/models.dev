# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): on the novita route a mid-conversation system message is rendered (+26 to +30 prompt tokens) and followed (French 2 of 2), so system_updates is true although Google's own API hoists it; no cache read on any request, so nothing to lose. No per-turn effort or tool-change mechanism reaches this model on this API.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true }

[limit]
output = 131_072

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
