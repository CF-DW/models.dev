# Mid-conversation: system_updates unset: no prompt caching on OpenRouter for this model, so there is no cached prefix to keep (2026-10-23)
# effort_updates = false: no per-turn effort control
schema = 2
name = "GPT-3.5 Turbo Instruct"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt"
open_weights = false
knowledge = "2021-09-30"
release_date = "2023-09-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 4_095
output = 3_685

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.5

[cost.text.output]
price = 2
