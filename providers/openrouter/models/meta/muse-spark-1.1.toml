# Mid-conversation: system_updates = true: Meta keeps late system/developer messages in place on its own API (providers/meta; live 2026-10-23); the only upstream here is Meta, and the 2026-10-19 Chat Completions probes here split one in place, one cache miss
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "meta/muse-spark-1.1"
description = "Open Llama multimodal model for image understanding and text reasoning"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
effort_updates = false

[limit]
output = 943_718

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25

[cost.web_search]
price = 2.5
