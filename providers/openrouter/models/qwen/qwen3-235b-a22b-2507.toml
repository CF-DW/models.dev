# Mid-conversation: system_updates unset: no prompt caching on OpenRouter for this model, so there is no cached prefix to keep (2026-10-23)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "alibaba/qwen3-235b-a22b-instruct-2507"
name = "Qwen3 235B A22B Instruct 2507"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = true
effort_updates = false

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.09

[cost.text.output]
price = 0.55
