# Direct endpoint: POST /models/chat/completions?api-version=2024-05-01-preview.
# Its published request schema documents no toggle, effort, or reasoning budget.
# https://learn.microsoft.com/en-us/rest/api/microsoftfoundry/model-inference/get-chat-completions/get-chat-completions (accessed 2026-06-25)
# Mid-conversation: Foundry's partner-model chat API documents no mid-conversation system, per-turn effort or tool-change mechanism
# (https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-chat-reasoning). Live (2026-10-23, Chat Completions) a system message between turns
# keeps the cached prefix and is followed on DeepSeek-V4.1-Flash, Kimi-K2.7-Code and grok-4-1-fast-non-reasoning, and is followed on Llama-3.3/Llama-4-Maverick
# (no cache on Llama); each DeepSeek, Kimi, Grok and Llama family follows its tested model.
schema = 2
base_model = "deepseek/deepseek-v4-flash"
name = "DeepSeek-V4-Flash"

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
structured_output = true
system_updates = true
effort_updates = false

[api.chat-completions]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/models"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 0.19

[cost.text.output]
price = 0.51
