# Mid-conversation: Foundry's partner-model chat API documents no mid-conversation system, per-turn effort or tool-change mechanism
# (https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-chat-reasoning). Live (2026-10-23, Chat Completions) a system message between turns is
# accepted in place and followed on mistral-small-2503 and cohere-command-a (Azure doesn't cache either); the Mistral and Cohere families follow them.
# API: Chat Completions only. Azure's Responses API lists OpenAI models only (https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses, Supported models).
schema = 2
name = "Command A"
description = "Cohere command model for multilingual enterprise agents, tools, and chat"
family = "command-a"
open_weights = true
knowledge = "2024-06-01"
release_date = "2025-03-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 131_072
output = 8_192

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/azure/chat" }

[cost.text.input]
price = 2.5

[cost.text.output]
price = 10
