# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview
# - https://ai.google.dev/gemini-api/docs/pricing
# - https://ai.google.dev/gemini-api/docs/generate-content/caching
# - https://ai.google.dev/gemini-api/docs/flex-inference
# - https://ai.google.dev/gemini-api/docs/priority-inference
# - https://ai.google.dev/gemini-api/docs/thinking
# - https://ai.google.dev/gemini-api/docs/image-understanding (and /audio, /video-understanding)
# - https://generativelanguage.googleapis.com/v1beta/models (topP/topK per model)
# Flex halves input/output only; cache reads and storage stay at Standard rates.
# system_updates (live 2026-10-23, generateContent): a {"role": "system", "parts": [{"text": ...}]} entry in
#   `contents` between the model reply and the next user turn is accepted, stays in place and is obeyed
#   (answered in French). Cached tokens with it 7562/7562 vs 7567/7567 on the unchanged control (short
#   systemInstruction, ~9k-token first user turn).
#   The same text in systemInstruction gave 0 cached. Undocumented: the spec lists only "user" and
#   "model" for Content.role (https://ai.google.dev/api/caching#Content). The Chat Completions
#   endpoint moves a late system message to the top (0 cached) and Interactions rejects system_input.
# Thinking config and tools are request-level; changing the thinking level drops the cache (live 2026-10-23).
# Grounding with Google Search: $14 per 1,000 search queries (each query the model runs is billed). Price: https://ai.google.dev/gemini-api/docs/pricing#gemini-3.1-pro-preview; support ("Search grounding: Supported"): https://ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview
# Token-only multipliers (object factor, so cost.web_search is unscaled): Grounding keeps its price under Priority, Flex and the scheduled increases (https://ai.google.dev/gemini-api/docs/pricing).
# APIs: generateContent, the OpenAI-compatible Chat Completions endpoint (https://ai.google.dev/gemini-api/docs/openai) and Interactions (https://ai.google.dev/gemini-api/docs/interactions-overview); Chat Completions and Interactions confirmed live 2026-10-22.
schema = 2
name = "Gemini 3.1 Pro Preview"
description = "Reasoning-first Gemini preview for agentic coding and complex problem solving"
family = "gemini-pro"
open_weights = false
knowledge = "2025-01"
release_date = "2026-02-19"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true
top_p = true
top_k = true
cache = { implicit = { min_tokens = 4_096 }, explicit = true }
service_tier = ["flex", "priority"]
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 65_536

[api.generate-content]

[api.chat-completions]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.interactions]
sdk = { opencodeai = "@opencode/ai/providers/google/interactions" }

[cost.text.input]
price = 2
cache = { read = 0.2, storage = 4.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18

[cost.web_search]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 1.8 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = { input = { price = 0.5 }, output = { price = 0.5 } } }
